name: MH Benchmark Pipeline

# Runs the paper pipeline: find -> filter -> extract -> push to the AI Inbox sheet.
on:
  schedule:
    # Weekly, Mondays at 13:00 UTC. Change this cron to adjust the day/time.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

# Allow the job to commit the updated data/ files (dedup memory + outputs) back.
permissions:
  contents: write

# Never run two pipeline jobs at once (protects seen-papers.json / the sheet).
concurrency:
  group: mh-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      INBOX_SHEET_ID: ${{ secrets.INBOX_SHEET_ID }}
      GOOGLE_CREDS_FILE: service_account.json
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Write the Google service-account key from the secret
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: "Step 1 of 4 — Find new papers (arXiv)"
        run: python scripts/find_papers.py

      - name: "Step 2 of 4 — Filter for relevance (Claude Haiku)"
        run: python scripts/filter_papers.py

      - name: "Step 3 of 4 — Extract benchmark fields (Claude Sonnet)"
        run: python scripts/extract_batch.py

      - name: "Step 4 of 4 — Push new papers to the AI Inbox sheet"
        run: python scripts/push_to_sheet.py

      - name: Remove the key file before committing (safety)
        if: always()
        run: rm -f service_account.json

      - name: Commit updated data back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: weekly pipeline run [skip ci]"
            git push
          fi
