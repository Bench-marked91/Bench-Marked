name: Refresh Website Catalog

# Pulls the team's "Benchmark catalog" Google Sheet into website/benchmarks.json
# so the website shows the latest data. Read-only on the sheet; commits the JSON.
on:
  workflow_dispatch: {}          # manual "Run workflow" button
  schedule:
    - cron: "0 12 * * *"         # daily at 12:00 UTC (change or remove as you like)

permissions:
  contents: write

concurrency:
  group: export-catalog
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Write the Google service-account key from the secret
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Export the catalog to website/benchmarks.json
        run: python scripts/export_catalog_to_website.py

      - name: Remove the key file before committing (safety)
        if: always()
        run: rm -f service_account.json

      - name: Commit the refreshed JSON if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/benchmarks.json
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "chore: refresh website catalog from sheet [skip ci]"
            git push
          fi
